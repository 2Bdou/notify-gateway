name = "notify-gateway"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "notify-gateway"
RATE_LIMIT_IP = "60"
RATE_LIMIT_PROJECT = "120"

[[kv_namespaces]]
binding = "NOTIFY_KV"
id = "00000000000000000000000000000000"

[[d1_databases]]
binding = "DB"
database_name = "notify-tasks"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
