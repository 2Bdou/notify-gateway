name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Create KV and D1 if wrangler.toml still has placeholders
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-cf-resources.mjs

      - name: Confirm D1 id is a real UUID
        run: |
          id=$(sed -n 's/^database_id = "\([^"]*\)"/\1/p' wrangler.toml | head -1)
          echo "D1 id=$id"
          if ! echo "$id" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "ensure-cf-resources did not write a real D1 UUID" >&2
            exit 1
          fi
          if echo "$id" | grep -Eq '^0+-0+-0+-0+-0+$'; then
            echo "D1 id is still the all-zero placeholder" >&2
            exit 1
          fi

      - name: Apply D1 migrations
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply notify-tasks --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            JWT_SECRET
            KEY_HMAC_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KEY_HMAC_SECRET: ${{ secrets.KEY_HMAC_SECRET }}
